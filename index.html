<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>18岁生日倒计时 | 迈向成年之路</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免选中文字，保持视觉整洁 */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b2b40 0%, #1a4b6e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰: 星星闪烁效果 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: rgba(255, 255, 200, 0.7);
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        /* 主卡片容器 */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 25, 35, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 30px 28px 50px 28px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 150, 0.3);
            max-width: 750px;
            width: 100%;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* 标题区 */
        .greeting {
            font-size: 1.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            color: #ffecb3;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 6px 22px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, #FFD966, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 15px 0 8px 0;
            letter-spacing: -0.5px;
        }

        .birthday-date {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 40px;
            color: #e0e7ff;
            margin-bottom: 30px;
            font-weight: 400;
            backdrop-filter: blur(5px);
        }

        /* 倒计时主区块 */
        .countdown-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 35px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            min-width: 110px;
            padding: 20px 10px;
            border-radius: 40px;
            text-align: center;
            border-bottom: 3px solid #ffb347;
            transition: transform 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .time-box:hover {
            transform: translateY(-5px);
            background: rgba(0,0,0,0.7);
        }

        .time-number {
            font-size: 3.5rem;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #FFF8E7, #FFD966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .time-label {
            font-size: 1rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 2px;
            color: #CDE4FF;
            margin-top: 8px;
        }

        /* 消息区域 */
        .message-area {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 18px 20px;
            margin: 20px 0 20px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #FFE6B3;
            border-left: 5px solid #FFA559;
            border-right: 5px solid #FFA559;
        }

        .special-note {
            font-size: 0.9rem;
            color: #bbd4ff;
            background: rgba(20, 40, 55, 0.7);
            border-radius: 30px;
            padding: 8px 15px;
            display: inline-block;
            margin-top: 10px;
        }

        /* 底部进展条 */
        .progress-section {
            margin-top: 30px;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #cfe6ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FFB347, #FF8C42);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        footer {
            font-size: 0.7rem;
            color: #8eb3d0;
            margin-top: 28px;
            opacity: 0.8;
        }

        @media (max-width: 550px) {
            .card {
                padding: 20px 16px 35px;
                border-radius: 48px;
            }
            .time-box {
                min-width: 70px;
                padding: 12px 6px;
            }
            .time-number {
                font-size: 2.2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .message-area {
                font-size: 1rem;
            }
        }

        /* 飘浮气球效果 (仅装饰) */
        .balloon {
            position: fixed;
            bottom: -80px;
            width: 40px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #ffaa66, #cc6633);
            border-radius: 50% 50% 50% 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
            animation: floatUp 12s infinite ease-in;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.2; bottom: -80px;}
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0;}
        }
    </style>
</head>
<body>

<div class="stars" id="stars-container"></div>

<div class="card">
    <div class="greeting">✨ 青春倒数 ✨</div>
    <h1>🎂 18岁成人礼 🎂</h1>
    <div class="birthday-date">🎈 目标日期：2030年11月3日 🎈</div>

    <!-- 倒计时核心区域 -->
    <div class="countdown-container">
        <div class="time-box">
            <div class="time-number" id="days">00</div>
            <div class="time-label">天</div>
        </div>
        <div class="time-box">
            <div class="time-number" id="hours">00</div>
            <div class="time-label">小时</div>
        </div>
        <div class="time-box">
            <div class="time-number" id="minutes">00</div>
            <div class="time-label">分钟</div>
        </div>
        <div class="time-box">
            <div class="time-number" id="seconds">00</div>
            <div class="time-label">秒</div>
        </div>
    </div>

    <div class="message-area" id="dynamicMessage">
        🌟 每一秒都是成长的印记 🌟
    </div>
    
    <div class="progress-section">
        <div class="progress-text">📅 时间进度 · 迈向十八岁</div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="special-note" id="percentageLabel">已完成 0%</div>
    </div>
    <footer>❤️ 从今天起，距离成年还有 <span id="totalRemainDaysSpan">---</span> 天 ❤️</footer>
</div>

<script>
    (function() {
        // ---------- 固定目标日期: 18岁生日 2030年11月3日 00:00:00 ----------
        // 根据题意: 生日是11月3日, 18岁生日在2030年11月3日 (从14岁(2026年)再过4年)
        // 为了让倒计时精确到每一秒，目标时间使用那一天的 00:00:00 (从当天凌晨开始庆祝)
        const TARGET_DATE = new Date(2030, 10, 3, 0, 0, 0); // 月份10表示11月（JS中月份从0开始）
        
        // 获取当前时间 (实时更新)
        function getCurrentDate() {
            return new Date(); // 本地系统时间，精确展示倒计时
        }

        // 更新所有UI元素
        function updateCountdown() {
            const now = getCurrentDate();
            const target = TARGET_DATE;
            
            // 计算时间差 (毫秒)
            let diffMs = target - now;
            
            // 如果已经过了目标时间 (成人礼已过或者正当时)
            let isPassed = diffMs <= 0;
            let absDiffMs = Math.abs(diffMs);
            
            // 倒计时剩余/超出的天、时、分、秒
            let totalSecondsRemain = Math.floor(absDiffMs / 1000);
            let days = Math.floor(totalSecondsRemain / 86400);
            let hours = Math.floor((totalSecondsRemain % 86400) / 3600);
            let minutes = Math.floor((totalSecondsRemain % 3600) / 60);
            let seconds = totalSecondsRemain % 60;
            
            // 如果时间已经过了生日（即已经满18岁），显示不同的庆祝模式
            if (isPassed) {
                // 过了 0 点, 显示已经成年，展示超出天数
                // 为了保持积极体验，显示 “已成年 X 天”
                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
                
                let msg = '';
                if (days === 0 && hours === 0 && minutes === 0 && seconds < 30) {
                    msg = '🎉 就在此刻！18岁生日快乐！成年快乐 🎉';
                } else {
                    msg = `🎂 恭喜你已经成年 ${days} 天 ${hours} 小时 ${minutes} 分钟！愿你拥有璀璨未来 🎂`;
                }
                document.getElementById('dynamicMessage').innerHTML = msg;
                // 进度条100% + 文本调整
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('percentageLabel').innerHTML = '🎉 已成年，100% 完成 🎉';
                document.getElementById('totalRemainDaysSpan').innerText = '0 (已成年)';
                return;
            }
            
            // 未到18岁：正常倒计时模式
            // 格式化显示 (补零)
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            
            // 计算从出生14岁(2026年5月1日) 到 18岁生日(2030年11月3日) 的总跨度天数，用于显示进度百分比
            // 但题目更多指向当前日期与总区间的比例，为了直观，我们计算从2026年5月1日 到 2030年11月3日 完整区间
            // 当前日期在区间内的比例 (从起点到现在的天数 / 起点到终点的总天数)
            const startDate = new Date(2026, 4, 1); // 2026年5月1日 (当前起始日，14岁时的日期)
            const endDate = TARGET_DATE;            // 2030年11月3日
            
            // 边界保护
            let totalDuration = endDate - startDate;   // 完整时间段毫秒
            let elapsed = now - startDate;              // 已经经过时间
            
            let percent = 0;
            if (totalDuration > 0) {
                percent = (elapsed / totalDuration) * 100;
                percent = Math.min(99.99, Math.max(0, percent));
            }
            
            // 进度条填充宽度
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('percentageLabel').innerHTML = `⏳ 已完成 ${percent.toFixed(3)}% · 坚持，成年在望`;
            
            // 剩余总天数展示 (用于辅助显示)
            document.getElementById('totalRemainDaysSpan').innerText = days;
            
            // 动态心情文字：基于剩余天数/小时提供有趣变化
            let message = '';
            if (days >= 365 * 2) {
                message = '🌱 青春正好，慢慢积累，未来可期！';
            } else if (days >= 365) {
                message = '📖 距离成年还有一年有余，珍惜每一寸光阴 ✨';
            } else if (days >= 180) {
                message = '🏃‍♂️ 还剩半年多，每天都离成年更进一步！';
            } else if (days >= 90) {
                message = '🎯 百日冲刺！向着十八岁勇敢奔跑吧！';
            } else if (days >= 30) {
                message = '📅 倒计时一个月 → 期待属于你的成人礼！';
            } else if (days >= 7) {
                message = '🔥 最后冲刺！不到最后一刻皆是变数，加油少年！';
            } else if (days > 0) {
                message = `🎁 只剩下 ${days} 天！激动人心的时刻即将来临！`;
            } else if (days === 0 && (hours > 0 || minutes > 0 || seconds > 0)) {
                message = '🎊 就是今天！！即将迎来18岁生日🎊 愿你快乐！';
            } else {
                message = '🌟 每一秒都是成长的印记 🌟';
            }
            
            // 增加基于剩余天数的特别提醒 (如果只有不到100天)
            if (days < 100 && days > 0) {
                message = `⚡ 仅剩 ${days} 天 ⚡ 准备好迎接成年人的世界吧！记得许愿🎂`;
            }
            if (days === 0 && hours === 0 && minutes < 60 && minutes > 0) {
                message = '💫 最后的倒计时！今日是你的庆典前奏 ✨';
            }
            document.getElementById('dynamicMessage').innerHTML = message;
        }
        
        // 生成星星装饰 (动态背景)
        function createStars() {
            const starsContainer = document.getElementById('stars-container');
            if (!starsContainer) return;
            const starCount = 130;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = Math.random() * 2 + 1.5 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // 生成随机漂浮气球 (简约氛围)
        function createBalloons() {
            const body = document.body;
            const balloonCount = 12;
            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');
                const leftPos = Math.random() * 100;
                const sizeW = 35 + Math.random() * 30;
                const sizeH = sizeW * 1.3;
                balloon.style.width = sizeW + 'px';
                balloon.style.height = sizeH + 'px';
                balloon.style.left = leftPos + '%';
                balloon.style.animationDelay = Math.random() * 10 + 's';
                balloon.style.animationDuration = 9 + Math.random() * 7 + 's';
                balloon.style.background = `radial-gradient(circle at 30% 30%, 
                    hsl(${Math.random() * 60 + 20}, 80%, 65%), 
                    hsl(${Math.random() * 50 + 10}, 70%, 45%))`;
                balloon.style.opacity = 0.2 + Math.random() * 0.4;
                body.appendChild(balloon);
            }
        }
        
        // 补一个可爱：显示日期有效性检查，确保目标日期是正确的2030年11月3日
        function validateTargetDate() {
            // 调试用控制台输出，确保预期
            const checkTarget = new Date(2030, 10, 3);
            if (checkTarget.getFullYear() === 2030 && checkTarget.getMonth() === 10 && checkTarget.getDate() === 3) {
                console.log("✅ 倒计时目标: 2030年11月3日 00:00:00");
            } else {
                console.warn("⚠️ 日期异常检查");
            }
        }
        
        // 精确同步刷新定时器 (每秒更新一次)
        let intervalId = null;
        function startTimer() {
            if (intervalId) clearInterval(intervalId);
            updateCountdown();    // 立即执行一次
            intervalId = setInterval(() => {
                updateCountdown();
            }, 1000);
        }
        
        // 页脚的特殊显示，增加今日日期提醒 (可选)
        function updateFooterDateInfo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const footerEl = document.querySelector('footer');
            if (footerEl && !footerEl.querySelector('.today-info')) {
                const todaySpan = document.createElement('span');
                todaySpan.className = 'today-info';
                todaySpan.style.display = 'block';
                todaySpan.style.marginTop = '8px';
                todaySpan.style.fontSize = '0.7rem';
                todaySpan.style.opacity = '0.7';
                footerEl.appendChild(todaySpan);
            }
            const infoSpan = document.querySelector('.today-info');
            if (infoSpan) {
                infoSpan.innerHTML = `📆 当前时间：${year}.${month}.${day}  |  距离18岁成人礼仅剩动态天数`;
            }
        }
        
        // 设置页面加载完成后所有效果
        window.addEventListener('DOMContentLoaded', () => {
            createStars();           // 繁星特效
            createBalloons();       // 装饰气球
            validateTargetDate();
            startTimer();
            updateFooterDateInfo();
            // 确保窗口缩放时没有任何影响，并额外每10秒刷新一次日期信息（保持年月日更新）
            setInterval(() => {
                updateFooterDateInfo();
            }, 60000);
        });
        
        // 处理页面可见性变化时，保证计时器稳定 (可选优化)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // 重新同步一次当前时间显示
                updateCountdown();
            }
        });
        
        // 针对闰秒或偏移不纠结，每秒刷新很准确。
    })();
</script>
</body>
  </html>
