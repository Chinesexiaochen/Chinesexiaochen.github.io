<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教程视频</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 16px; }
    video {
      width: min(90vw, 960px);
      border-radius: 10px;
      background: #000;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <h1>教程视频</h1>
  <video controls preload="metadata">
    <source src="jiaocheng.mp4" type="video/mp4">
    你的浏览器不支持视频播放。
  </video>
</body>
</html>
