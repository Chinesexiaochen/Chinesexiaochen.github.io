<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA6 高清泄露版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            /* 背景图：全屏铺满，居中，不重复 */
            background-image: url('gta6.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* 半透明遮罩，让背景图隐约透出来，同时提升文字可读性 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            /* 磨砂玻璃效果 */
            background: rgba(10, 10, 15, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 106, 0, 0.35);
            border-radius: 32px;
            padding: 50px 35px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 80px rgba(255, 106, 0, 0.08);
            transition: 0.3s;
        }
        .card:hover {
            border-color: rgba(255, 106, 0, 0.6);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 100px rgba(255, 106, 0, 0.15);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 106, 0, 0.9);
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 5px 20px;
            border-radius: 50px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
            box-shadow: 0 0 30px rgba(255, 106, 0, 0.3);
        }
        h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 0 40px rgba(255, 106, 0, 0.2);
        }
        h1 strong {
            font-weight: 900;
            color: #ff6a00;
            font-size: 26px;
            letter-spacing: 2px;
        }
        .sub {
            color: rgba(255, 170, 102, 0.8);
            font-size: 13px;
            margin-bottom: 28px;
            letter-spacing: 3px;
            font-weight: 300;
        }

        /* 下载按钮 - 配合背景的橙黑风格 */
        .download-btn {
            display: block;
            width: 100%;
            padding: 18px 0;
            background: linear-gradient(135deg, #ff6a00, #e63900);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 4px;
            box-shadow: 0 8px 40px rgba(255, 106, 0, 0.35);
            transition: 0.25s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: 0.6s;
        }
        .download-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }
        .download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 50px rgba(255, 106, 0, 0.5);
        }
        .download-btn:active {
            transform: scale(0.96);
        }
        .download-btn .arrow {
            display: inline-block;
            margin-left: 10px;
            animation: bounceArrow 1.4s infinite;
        }
        @keyframes bounceArrow {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
        }
        .footer-text span {
            color: #ff6a00;
            font-weight: 600;
            opacity: 0.7;
        }

        .loading-tip {
            margin-top: 16px;
            color: rgba(255, 170, 102, 0.6);
            font-size: 13px;
            display: none;
            letter-spacing: 1px;
        }
        .loading-tip.show {
            display: block;
        }
        .loading-tip i {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-style: normal;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 视频全屏 */
        #rick-video {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
            background: #000;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">🔥 泄密版 · 24小时删</div>
    <h1>GRAND THEFT AUTO <strong>VI</strong></h1>
    <div class="sub">⚡ 原生4K · 完整战役泄露 ⚡</div>

    <button class="download-btn" id="downloadBtn">
        ⬇ 立即下载 <span class="arrow">▶</span>
    </button>

    <div class="loading-tip" id="loadingTip">
        <i>⟳</i> 正在加密连接至R星服务器...
    </div>

    <div class="footer-text">
        🔒 安全加密 · <span>已泄露</span> · 2.3TB 完整包
    </div>
</div>

<!-- 本地视频 -->
<video id="rick-video" src="rick.mp4" playsinline preload="auto"></video>

<script>
    const btn = document.getElementById('downloadBtn');
    const tip = document.getElementById('loadingTip');
    const video = document.getElementById('rick-video');

    btn.addEventListener('click', function() {
        btn.innerHTML = '⏳ 解密中...';
        btn.style.background = '#333';
        btn.style.boxShadow = 'none';
        btn.style.cursor = 'default';
        btn.disabled = true;
        tip.classList.add('show');

        setTimeout(() => {
            video.style.display = 'block';
            video.play().catch(() => {
                document.addEventListener('click', function playOnce() {
                    video.play();
                    document.removeEventListener('click', playOnce);
                });
            });
            document.querySelector('.card').style.display = 'none';
            tip.classList.remove('show');
        }, 1500);
    });
</script>

</body>
</html>
